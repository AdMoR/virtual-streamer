<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Browser — Virtual Streamer</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary:    #0d1117;
            --bg-secondary:  #161b22;
            --bg-tertiary:   #21262d;
            --border-color:  #30363d;
            --text-primary:  #e6edf3;
            --text-secondary:#8b949e;
            --accent-cyan:   #58a6ff;
            --accent-green:  #3fb950;
            --accent-purple: #a371f7;
            --accent-red:    #f85149;
            --accent-orange: #f0883e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.5rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        header a { color: var(--text-secondary); text-decoration: none; font-size: 0.85rem; }
        header a:hover { color: var(--accent-cyan); }
        header .sep { color: var(--border-color); }
        header h1 {
            font-size: 1.1rem; font-weight: 600;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--accent-red); margin-left: auto; transition: background 0.3s;
        }
        .status-dot.ok { background: var(--accent-green); }
        .status-label { font-size: 0.78rem; color: var(--text-secondary); }

        .layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        /* ── Sidebar ──────────────────────────────────────────── */
        .sidebar {
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-shrink: 0;
        }
        .sidebar-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-secondary);
            flex: 1;
        }
        .btn-refresh {
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.8rem;
            padding: 3px 8px;
            font-family: inherit;
            transition: border-color 0.15s, color 0.15s;
        }
        .btn-refresh:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }
        .btn-refresh.spinning { animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .api-url-row {
            padding: 0.6rem 1rem;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .api-url-row input {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            padding: 4px 8px;
            width: 100%;
        }
        .api-url-row input:focus { outline: none; border-color: var(--accent-cyan); }

        .story-list {
            overflow-y: auto;
            flex: 1;
        }

        .story-item {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            transition: background 0.1s;
        }
        .story-item:hover { background: var(--bg-tertiary); }
        .story-item.selected {
            background: var(--bg-tertiary);
            border-left: 3px solid var(--accent-cyan);
            padding-left: calc(1rem - 3px);
        }
        .story-item-title {
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .story-item-meta {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .story-item-date {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            color: var(--text-secondary);
        }

        .status-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 10px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .status-badge.PENDING   { background: rgba(240,136,62,0.15); color: var(--accent-orange); border: 1px solid rgba(240,136,62,0.3); }
        .status-badge.GENERATING{ background: rgba(88,166,255,0.15); color: var(--accent-cyan);   border: 1px solid rgba(88,166,255,0.3); animation: pulse-badge 1.5s ease-in-out infinite; }
        .status-badge.COMPLETED { background: rgba(63,185,80,0.15);  color: var(--accent-green);  border: 1px solid rgba(63,185,80,0.3); }
        .status-badge.FAILED    { background: rgba(248,81,73,0.15);  color: var(--accent-red);    border: 1px solid rgba(248,81,73,0.3); }
        @keyframes pulse-badge { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

        .empty-list {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 200px;
            gap: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        .empty-icon { font-size: 2.5rem; opacity: 0.3; }

        /* ── Main content ─────────────────────────────────────── */
        .main {
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .placeholder {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 100%;
            gap: 0.75rem; color: var(--text-secondary);
        }
        .placeholder-icon { font-size: 4rem; opacity: 0.3; }
        .placeholder p { font-size: 0.9rem; }

        /* Story detail header */
        .story-detail-header {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1.1rem 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }
        .story-detail-title-row {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
        .story-detail-title {
            font-size: 1.15rem;
            font-weight: 600;
            flex: 1;
        }
        .story-meta-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .story-meta-item {
            display: flex;
            gap: 0.4rem;
            align-items: center;
        }
        .story-meta-label {
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }
        .story-meta-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            color: var(--text-primary);
        }

        /* Section card */
        .section-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
        }
        .section-card-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1.1rem;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            user-select: none;
        }
        .section-card-header:hover { background: #2d333a; }
        .section-badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
        }
        .section-card-title { font-weight: 600; font-size: 0.92rem; }
        .section-card-count {
            margin-left: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            color: var(--text-secondary);
        }
        .chevron {
            font-size: 0.7rem;
            color: var(--text-secondary);
            transition: transform 0.2s;
        }
        .section-card.collapsed .chevron { transform: rotate(-90deg); }
        .section-card-body { padding: 1.1rem; }
        .section-card.collapsed .section-card-body { display: none; }

        /* Story plan text */
        .story-plan-text {
            font-size: 0.88rem;
            line-height: 1.75;
            white-space: pre-wrap;
            color: var(--text-primary);
        }

        /* Scene list */
        .scene-list { display: flex; flex-direction: column; gap: 1rem; }
        .scene-item {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.9rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }
        .scene-header {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
        }
        .scene-num {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 1px 7px;
            color: var(--accent-orange);
        }
        .scene-location-tag {
            font-size: 0.72rem;
            padding: 1px 8px;
            border-radius: 10px;
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            font-family: 'JetBrains Mono', monospace;
        }
        .scene-speaker-tag {
            font-size: 0.72rem;
            padding: 1px 8px;
            border-radius: 10px;
            border: 1px solid var(--accent-purple);
            color: var(--accent-purple);
            font-family: 'JetBrains Mono', monospace;
        }
        .scene-duration-tag {
            font-size: 0.72rem;
            padding: 1px 8px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
            margin-left: auto;
        }

        .scene-field { display: flex; flex-direction: column; gap: 3px; }
        .scene-field-label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }
        .scene-field-value {
            font-size: 0.85rem;
            color: var(--text-primary);
            line-height: 1.55;
        }
        .scene-spoken {
            background: var(--bg-primary);
            border-left: 3px solid var(--accent-green);
            padding: 0.4rem 0.7rem;
            font-style: italic;
            font-size: 0.88rem;
            color: var(--text-primary);
            border-radius: 0 4px 4px 0;
            line-height: 1.55;
        }

        .artifact-row {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 0.15rem;
        }
        .artifact-link {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--accent-cyan);
            text-decoration: none;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 1px 7px;
        }
        .artifact-link:hover { border-color: var(--accent-cyan); }

        /* Loading skeleton */
        .skeleton-line {
            height: 14px;
            background: var(--bg-tertiary);
            border-radius: 4px;
            animation: shimmer 1.4s ease-in-out infinite;
        }
        @keyframes shimmer { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        /* Error toast */
        #error-toast {
            display: none;
            position: fixed;
            bottom: 1.5rem; left: 50%;
            transform: translateX(-50%);
            background: rgba(248,81,73,0.15);
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            font-size: 0.85rem;
            z-index: 999;
            max-width: 560px;
            text-align: center;
        }
        #error-toast.visible { display: block; }

        /* Auto-refresh indicator */
        .refresh-indicator {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--text-secondary);
            padding: 0.5rem 1rem;
            border-top: 1px solid var(--border-color);
            text-align: center;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<header>
    <a href="index.html">Apps</a>
    <span class="sep">/</span>
    <h1>Story Browser</h1>
    <span class="status-label" id="status-label">checking…</span>
    <div class="status-dot" id="status-dot"></div>
</header>

<div class="layout">
    <!-- ── Sidebar ─────────────────────────────────────────── -->
    <aside class="sidebar">
        <div class="api-url-row">
            <input type="text" id="api-url" value="http://localhost:8000"
                   placeholder="http://localhost:8000"
                   onchange="refresh()">
        </div>
        <div class="sidebar-header">
            <span class="sidebar-title">Recent Stories</span>
            <button class="btn-refresh" id="btn-refresh" onclick="refresh()" title="Refresh">↻</button>
        </div>

        <div class="story-list" id="story-list">
            <div class="empty-list">
                <div class="empty-icon">📚</div>
                <span>Loading stories…</span>
            </div>
        </div>

        <div class="refresh-indicator" id="refresh-indicator">auto-refresh in —</div>
    </aside>

    <!-- ── Main ───────────────────────────────────────────── -->
    <main class="main" id="main-area">
        <div class="placeholder" id="placeholder">
            <div class="placeholder-icon">📖</div>
            <p>Select a story from the list to inspect its scenes.</p>
        </div>
    </main>
</div>

<div id="error-toast"></div>

<script>
const $ = id => document.getElementById(id);

let selectedStoryId = null;
let refreshTimer = null;
let countdown = 3600;

// ── Helpers ───────────────────────────────────────────────────────────────────
function base() { return $('api-url').value.replace(/\/$/, ''); }

function escHtml(s) {
    if (!s) return '';
    return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

function fmtDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleString(undefined, {
        month: 'short', day: 'numeric',
        hour: '2-digit', minute: '2-digit',
    });
}

function showError(msg) {
    const t = $('error-toast');
    t.textContent = msg;
    t.classList.add('visible');
    setTimeout(() => t.classList.remove('visible'), 8000);
}

function toggleCard(id) {
    $(id).classList.toggle('collapsed');
}

// ── Health check ──────────────────────────────────────────────────────────────
async function checkHealth() {
    try {
        const r = await fetch(`${base()}/health`, { signal: AbortSignal.timeout(4000) });
        if (r.ok) {
            $('status-dot').classList.add('ok');
            $('status-label').textContent = 'API online';
        } else {
            $('status-dot').classList.remove('ok');
            $('status-label').textContent = `API ${r.status}`;
        }
    } catch {
        $('status-dot').classList.remove('ok');
        $('status-label').textContent = 'API offline';
    }
}

// ── Story list ────────────────────────────────────────────────────────────────
async function loadStories() {
    const btn = $('btn-refresh');
    btn.classList.add('spinning');
    try {
        const r = await fetch(`${base()}/api/v1/stories?limit=30`, {
            signal: AbortSignal.timeout(8000),
        });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const stories = await r.json();
        renderStoryList(stories);
    } catch (e) {
        $('story-list').innerHTML = `
            <div class="empty-list">
                <div class="empty-icon">⚠️</div>
                <span>${escHtml(e.message)}</span>
            </div>`;
    } finally {
        btn.classList.remove('spinning');
    }
}

function renderStoryList(stories) {
    const list = $('story-list');
    if (!stories.length) {
        list.innerHTML = `
            <div class="empty-list">
                <div class="empty-icon">📭</div>
                <span>No stories yet</span>
            </div>`;
        return;
    }
    list.innerHTML = '';
    stories.forEach(s => {
        const el = document.createElement('div');
        el.className = 'story-item' + (s.story_id === selectedStoryId ? ' selected' : '');
        el.dataset.id = s.story_id;
        el.innerHTML = `
            <div class="story-item-title">${escHtml(s.title)}</div>
            <div class="story-item-meta">
                <span class="status-badge ${escHtml(s.status)}">${escHtml(s.status)}</span>
                <span class="story-item-date">${fmtDate(s.created_at)}</span>
            </div>
        `;
        el.addEventListener('click', () => selectStory(s.story_id));
        list.appendChild(el);
    });
}

// ── Story detail ──────────────────────────────────────────────────────────────
async function selectStory(storyId) {
    selectedStoryId = storyId;
    // Update selected highlight in sidebar
    document.querySelectorAll('.story-item').forEach(el => {
        el.classList.toggle('selected', el.dataset.id === storyId);
    });

    const main = $('main-area');
    main.innerHTML = `
        <div style="display:flex;flex-direction:column;gap:1rem;">
            <div class="skeleton-line" style="width:60%;height:20px;"></div>
            <div class="skeleton-line" style="width:40%;height:14px;"></div>
            <div class="skeleton-line" style="width:100%;height:14px;margin-top:0.5rem;"></div>
            <div class="skeleton-line" style="width:90%;height:14px;"></div>
            <div class="skeleton-line" style="width:95%;height:14px;"></div>
        </div>`;

    try {
        const [storyRes, scenesRes] = await Promise.all([
            fetch(`${base()}/api/v1/stories/${storyId}`, { signal: AbortSignal.timeout(8000) }),
            fetch(`${base()}/api/v1/stories/${storyId}/scenes`, { signal: AbortSignal.timeout(8000) }),
        ]);
        if (!storyRes.ok) throw new Error(`Story fetch: HTTP ${storyRes.status}`);
        if (!scenesRes.ok) throw new Error(`Scenes fetch: HTTP ${scenesRes.status}`);

        const story = await storyRes.json();
        const scenes = await scenesRes.json();
        renderStoryDetail(story, scenes);
    } catch (e) {
        main.innerHTML = `
            <div class="placeholder">
                <div class="placeholder-icon">⚠️</div>
                <p>${escHtml(e.message)}</p>
            </div>`;
        showError(e.message);
    }
}

function renderStoryDetail(story, scenes) {
    const main = $('main-area');
    main.innerHTML = '';

    // ── Header card ──
    const header = document.createElement('div');
    header.className = 'story-detail-header';
    header.innerHTML = `
        <div class="story-detail-title-row">
            <span class="story-detail-title">${escHtml(story.title)}</span>
            <span class="status-badge ${escHtml(story.status)}">${escHtml(story.status)}</span>
        </div>
        <div class="story-meta-row">
            <div class="story-meta-item">
                <span class="story-meta-label">ID</span>
                <span class="story-meta-value">${escHtml(story.story_id)}</span>
            </div>
            <div class="story-meta-item">
                <span class="story-meta-label">Template</span>
                <span class="story-meta-value">${escHtml(story.story_template_id || '—')}</span>
            </div>
            <div class="story-meta-item">
                <span class="story-meta-label">Created</span>
                <span class="story-meta-value">${fmtDate(story.created_at)}</span>
            </div>
            <div class="story-meta-item">
                <span class="story-meta-label">Updated</span>
                <span class="story-meta-value">${fmtDate(story.updated_at)}</span>
            </div>
            ${story.final_video_key ? `
            <div class="story-meta-item">
                <span class="story-meta-label">Video</span>
                <span class="story-meta-value" style="color:var(--accent-green);">${escHtml(story.final_video_key)}</span>
            </div>` : ''}
        </div>
    `;
    main.appendChild(header);

    // ── Story plan card ──
    const planCard = buildSectionCard('card-plan', 'Story Plan', '', story.story_plan
        ? `<div class="story-plan-text">${escHtml(story.story_plan)}</div>`
        : `<span style="color:var(--text-secondary);font-size:0.85rem;">—</span>`
    );
    main.appendChild(planCard);

    // ── Scenes card ──
    const sceneCount = scenes.length;
    const scenesHtml = buildScenesHtml(scenes);
    const scenesCard = buildSectionCard(
        'card-scenes',
        'Scenes',
        `${sceneCount} scene${sceneCount !== 1 ? 's' : ''}`,
        scenesHtml
    );
    main.appendChild(scenesCard);

    // Re-attach toggle handlers
    document.querySelectorAll('.section-card-header').forEach(h => {
        h.addEventListener('click', () => {
            h.closest('.section-card').classList.toggle('collapsed');
            const chevron = h.querySelector('.chevron');
            // chevron rotation is handled by CSS
        });
    });
}

function buildSectionCard(id, title, count, bodyHtml) {
    const card = document.createElement('div');
    card.className = 'section-card';
    card.id = id;
    card.innerHTML = `
        <div class="section-card-header">
            <span class="section-card-title">${escHtml(title)}</span>
            ${count ? `<span class="section-card-count">${escHtml(count)}</span>` : ''}
            <span class="chevron">▼</span>
        </div>
        <div class="section-card-body">${bodyHtml}</div>
    `;
    return card;
}

function buildScenesHtml(scenes) {
    if (!scenes.length) {
        return `<span style="color:var(--text-secondary);font-size:0.85rem;">No scenes generated yet.</span>`;
    }

    return `<div class="scene-list">${scenes.map((s, i) => {
        const locTag = s.location_id
            ? `<span class="scene-location-tag">${escHtml(s.location_id)}</span>` : '';
        const speakerTag = s.speaker_id
            ? `<span class="scene-speaker-tag">${escHtml(s.speaker_id)}</span>` : '';
        const durTag = s.duration_seconds != null
            ? `<span class="scene-duration-tag">${s.duration_seconds.toFixed(1)}s</span>` : '';

        const spokenBlock = s.spoken_line ? `
            <div class="scene-field">
                <div class="scene-field-label">Dialogue</div>
                <div class="scene-spoken">${escHtml(s.spoken_line)}</div>
            </div>` : '';

        const promptBlock = s.prompt ? `
            <div class="scene-field">
                <div class="scene-field-label">Prompt</div>
                <div class="scene-field-value">${escHtml(s.prompt)}</div>
            </div>` : '';

        const videoKey = s.video_segment_key
            ? `<span class="scene-field-label">Video</span>
               <span class="scene-field-value" style="font-family:'JetBrains Mono',monospace;font-size:0.72rem;color:var(--accent-green);">${escHtml(s.video_segment_key)}</span>`
            : '';
        const audioKey = s.audio_key
            ? `<span class="scene-field-label" style="margin-left:1rem;">Audio</span>
               <span class="scene-field-value" style="font-family:'JetBrains Mono',monospace;font-size:0.72rem;color:var(--accent-purple);">${escHtml(s.audio_key)}</span>`
            : '';
        const artifactRow = (videoKey || audioKey)
            ? `<div class="artifact-row">${videoKey}${audioKey}</div>` : '';

        return `
        <div class="scene-item">
            <div class="scene-header">
                <span class="scene-num">#${s.scene_index + 1}</span>
                ${locTag}
                ${speakerTag}
                ${durTag}
            </div>
            ${promptBlock}
            ${spokenBlock}
            ${artifactRow}
        </div>`;
    }).join('')}</div>`;
}

// ── Auto-refresh ──────────────────────────────────────────────────────────────
function startCountdown() {
    clearInterval(refreshTimer);
    countdown = 15;
    $('refresh-indicator').textContent = `auto-refresh in ${countdown}s`;
    refreshTimer = setInterval(() => {
        countdown--;
        $('refresh-indicator').textContent = `auto-refresh in ${countdown}s`;
        if (countdown <= 0) {
            refresh();
        }
    }, 1000);
}

async function refresh() {
    clearInterval(refreshTimer);
    await Promise.all([checkHealth(), loadStories()]);
    if (selectedStoryId) await selectStory(selectedStoryId);
    startCountdown();
}

// ── Init ──────────────────────────────────────────────────────────────────────
refresh();
</script>
