<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entity Browser — Virtual Streamer</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary:    #0d1117;
            --bg-secondary:  #161b22;
            --bg-tertiary:   #21262d;
            --border-color:  #30363d;
            --text-primary:  #e6edf3;
            --text-secondary:#8b949e;
            --accent-cyan:   #58a6ff;
            --accent-green:  #3fb950;
            --accent-orange: #d29922;
            --accent-purple: #a371f7;
            --accent-pink:   #f778ba;
            --accent-red:    #f85149;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Header ─────────────────────────────────────────────────── */
        header {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.875rem 1.5rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .header-icon {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; flex-shrink: 0;
        }

        header h1 {
            font-size: 1.25rem; font-weight: 600;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header .subtitle {
            font-size: 0.8rem; color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
        }

        .api-config {
            margin-left: auto;
            display: flex; align-items: center; gap: 0.5rem;
        }

        .api-config label { font-size: 0.8rem; color: var(--text-secondary); }

        .api-config input {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px; padding: 0.375rem 0.75rem;
            color: var(--text-primary); font-size: 0.8rem; width: 220px;
        }

        .api-config input:focus { outline: none; border-color: var(--accent-cyan); }

        /* ── Layout ─────────────────────────────────────────────────── */
        .layout {
            display: grid;
            grid-template-columns: 200px 1fr 400px;
            flex: 1;
            overflow: hidden;
        }

        /* ── Sidebar ────────────────────────────────────────────────── */
        .sidebar {
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            padding: 1rem 0.75rem;
            overflow-y: auto;
        }

        .sidebar-title {
            font-size: 0.7rem; text-transform: uppercase;
            letter-spacing: 0.1em; color: var(--text-secondary);
            padding: 0 0.5rem; margin-bottom: 0.75rem;
        }

        .nav-item {
            display: flex; align-items: center; gap: 0.625rem;
            padding: 0.625rem 0.75rem;
            border-radius: 6px; cursor: pointer;
            font-size: 0.875rem; font-weight: 500;
            color: var(--text-secondary);
            transition: background 0.15s, color 0.15s;
            margin-bottom: 0.25rem;
            border: none; background: none; width: 100%; text-align: left;
        }

        .nav-item:hover { background: var(--bg-tertiary); color: var(--text-primary); }

        .nav-item.active {
            background: rgba(88, 166, 255, 0.12);
            color: var(--accent-cyan);
        }

        .nav-item .nav-icon { font-size: 1rem; width: 20px; text-align: center; }

        .nav-item .nav-count {
            margin-left: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            background: var(--bg-tertiary);
            padding: 0.1rem 0.4rem;
            border-radius: 999px;
            color: var(--text-secondary);
        }

        /* ── List panel ─────────────────────────────────────────────── */
        .list-panel {
            display: flex; flex-direction: column; overflow: hidden;
        }

        .list-toolbar {
            display: flex; align-items: center; gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-secondary);
            flex-shrink: 0;
        }

        .search-input {
            flex: 1;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px; padding: 0.375rem 0.75rem;
            color: var(--text-primary); font-size: 0.875rem;
        }

        .search-input:focus { outline: none; border-color: var(--accent-cyan); }

        .refresh-btn {
            background: var(--bg-tertiary); border: 1px solid var(--border-color);
            color: var(--text-secondary); border-radius: 6px;
            padding: 0.375rem 0.75rem; cursor: pointer; font-size: 0.8rem;
            transition: border-color 0.15s, color 0.15s;
        }

        .refresh-btn:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }

        .list-scroller { flex: 1; overflow-y: auto; padding: 0.75rem; }

        /* ── Cards ──────────────────────────────────────────────────── */
        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px; padding: 0.875rem 1rem;
            margin-bottom: 0.5rem; cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
        }

        .card:hover { border-color: var(--accent-cyan); background: var(--bg-tertiary); }
        .card.selected { border-color: var(--accent-cyan); background: rgba(88,166,255,0.06); }

        .card-title {
            font-weight: 600; font-size: 0.9rem;
            margin-bottom: 0.25rem;
        }

        .card-id {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem; color: var(--accent-cyan);
            margin-bottom: 0.5rem;
        }

        .card-desc {
            font-size: 0.8rem; color: var(--text-secondary);
            display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden;
        }

        .card-tags { display: flex; flex-wrap: wrap; gap: 0.375rem; margin-top: 0.5rem; }

        .tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem; padding: 0.15rem 0.5rem;
            border-radius: 999px; border: 1px solid;
        }

        .tag-cyan   { color: var(--accent-cyan);   border-color: rgba(88,166,255,0.3);  background: rgba(88,166,255,0.08); }
        .tag-purple { color: var(--accent-purple); border-color: rgba(163,113,247,0.3); background: rgba(163,113,247,0.08); }
        .tag-green  { color: var(--accent-green);  border-color: rgba(63,185,80,0.3);   background: rgba(63,185,80,0.08); }
        .tag-orange { color: var(--accent-orange); border-color: rgba(210,153,34,0.3);  background: rgba(210,153,34,0.08); }
        .tag-pink   { color: var(--accent-pink);   border-color: rgba(247,120,186,0.3); background: rgba(247,120,186,0.08); }

        /* ── Detail panel ───────────────────────────────────────────── */
        .detail-panel {
            border-left: 1px solid var(--border-color);
            background: var(--bg-secondary);
            overflow-y: auto; padding: 1.25rem;
        }

        .detail-placeholder {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100%; color: var(--text-secondary);
            gap: 0.75rem;
        }

        .detail-placeholder .big-icon { font-size: 3rem; opacity: 0.3; }

        .detail-header { margin-bottom: 1.25rem; }

        .detail-name {
            font-size: 1.2rem; font-weight: 600; margin-bottom: 0.25rem;
        }

        .detail-id {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem; color: var(--accent-cyan);
        }

        .detail-section { margin-bottom: 1.25rem; }

        .detail-label {
            font-size: 0.7rem; text-transform: uppercase;
            letter-spacing: 0.08em; color: var(--text-secondary);
            margin-bottom: 0.4rem; font-weight: 600;
        }

        .detail-value {
            font-size: 0.875rem; color: var(--text-primary); line-height: 1.5;
        }

        .prompt-block {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px; padding: 1rem;
            max-height: 55vh; overflow-y: auto;
        }

        .prompt-block pre {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem; color: var(--accent-green);
            white-space: pre-wrap; word-break: break-word;
            line-height: 1.6;
        }

        .voice-sample {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px; padding: 0.625rem 0.75rem;
            margin-bottom: 0.5rem;
        }

        .voice-sample .sample-path {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem; color: var(--accent-cyan);
            margin-bottom: 0.25rem; word-break: break-all;
        }

        .voice-sample .sample-transcript {
            font-size: 0.8rem; color: var(--text-secondary); font-style: italic;
        }

        .status-dot {
            display: inline-block; width: 8px; height: 8px;
            border-radius: 50%; margin-right: 0.375rem;
        }

        .status-active { background: var(--accent-green); }
        .status-inactive { background: var(--text-secondary); }

        /* ── States ─────────────────────────────────────────────────── */
        .empty-state {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 3rem 1rem; color: var(--text-secondary); gap: 0.5rem;
        }

        .empty-icon { font-size: 2.5rem; opacity: 0.3; }

        .spinner {
            width: 28px; height: 28px;
            border: 2px solid var(--border-color);
            border-top-color: var(--accent-cyan);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 2rem auto;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .error-msg {
            background: rgba(248,81,73,0.1);
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
            padding: 0.75rem; border-radius: 6px; font-size: 0.85rem;
            margin: 0.5rem;
        }

        .divider {
            border: none; border-top: 1px solid var(--border-color);
            margin: 1rem 0;
        }

        /* collection template sub-card */
        .sub-card {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px; padding: 0.625rem 0.75rem;
            margin-bottom: 0.5rem; cursor: pointer;
            transition: border-color 0.15s;
        }
        .sub-card:hover { border-color: var(--accent-purple); }
        .sub-card-name { font-weight: 500; font-size: 0.85rem; margin-bottom: 0.2rem; }
        .sub-card-id { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: var(--accent-purple); }

        /* ── Edit form ───────────────────────────────────────────────── */
        .form-group { margin-bottom: 0.75rem; }

        .form-label {
            display: block; font-size: 0.72rem; text-transform: uppercase;
            letter-spacing: 0.07em; color: var(--text-secondary);
            font-weight: 600; margin-bottom: 0.3rem;
        }

        .form-input, .form-textarea {
            width: 100%;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px; padding: 0.4rem 0.625rem;
            color: var(--text-primary); font-size: 0.85rem;
            font-family: inherit;
        }

        .form-input:focus, .form-textarea:focus {
            outline: none; border-color: var(--accent-cyan);
        }

        .form-textarea { resize: vertical; min-height: 70px; line-height: 1.5; }

        .btn-primary {
            display: inline-flex; align-items: center; gap: 0.375rem;
            background: rgba(88,166,255,0.12);
            border: 1px solid rgba(88,166,255,0.4);
            color: var(--accent-cyan);
            border-radius: 6px; padding: 0.4rem 0.875rem;
            font-size: 0.8rem; cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        .btn-primary:hover { background: rgba(88,166,255,0.22); border-color: var(--accent-cyan); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

        .form-file-input {
            width: 100%; font-size: 0.8rem; color: var(--text-secondary);
            background: var(--bg-primary); border: 1px dashed var(--border-color);
            border-radius: 6px; padding: 0.4rem 0.625rem; cursor: pointer;
            margin-bottom: 0.5rem;
        }
        .form-file-input:hover { border-color: var(--accent-cyan); }

        /* ── Delete button ───────────────────────────────────────────── */
        .btn-delete {
            display: inline-flex; align-items: center; gap: 0.375rem;
            background: rgba(248,81,73,0.1);
            border: 1px solid rgba(248,81,73,0.4);
            color: var(--accent-red);
            border-radius: 6px; padding: 0.4rem 0.875rem;
            font-size: 0.8rem; cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            margin-top: 0.75rem;
        }
        .btn-delete:hover { background: rgba(248,81,73,0.2); border-color: var(--accent-red); }
    </style>
</head>
<body>

<!-- Header -->
<header>
    <div class="header-icon">🗂</div>
    <div>
        <h1>Entity Browser</h1>
        <span class="subtitle">Virtual Streamer</span>
    </div>
    <div class="api-config">
        <label>API:</label>
        <input type="text" id="api-url" value="http://localhost:8000">
    </div>
</header>

<!-- Main layout -->
<div class="layout">

    <!-- Sidebar -->
    <nav class="sidebar">
        <p class="sidebar-title">Entities</p>
        <button class="nav-item" id="nav-characters"      onclick="loadSection('characters')">
            <span class="nav-icon">👤</span> Characters
            <span class="nav-count" id="count-characters">—</span>
        </button>
        <button class="nav-item" id="nav-story-templates" onclick="loadSection('story-templates')">
            <span class="nav-icon">📜</span> Story Templates
            <span class="nav-count" id="count-story-templates">—</span>
        </button>
        <button class="nav-item" id="nav-collections"     onclick="loadSection('collections')">
            <span class="nav-icon">🗂</span> Collections
            <span class="nav-count" id="count-collections">—</span>
        </button>
        <button class="nav-item" id="nav-streams"         onclick="loadSection('streams')">
            <span class="nav-icon">📡</span> Streams
            <span class="nav-count" id="count-streams">—</span>
        </button>
        <button class="nav-item" id="nav-clips"           onclick="loadSection('clips')">
            <span class="nav-icon">🎞</span> Clips
            <span class="nav-count" id="count-clips">—</span>
        </button>
        <button class="nav-item" id="nav-locations"       onclick="loadSection('locations')">
            <span class="nav-icon">🗺</span> Locations
            <span class="nav-count" id="count-locations">—</span>
        </button>
    </nav>

    <!-- List panel -->
    <div class="list-panel">
        <div class="list-toolbar">
            <input class="search-input" type="text" id="search" placeholder="Filter…" oninput="applyFilter()">
            <button class="refresh-btn" onclick="reload()">↻ Refresh</button>
            <button class="btn-primary" id="create-btn" style="display:none" onclick="showCreateLocationForm()">+ New</button>
        </div>
        <div class="list-scroller" id="list-scroller">
            <div class="empty-state">
                <span class="empty-icon">👈</span>
                <span>Select an entity type</span>
            </div>
        </div>
    </div>

    <!-- Detail panel -->
    <div class="detail-panel" id="detail-panel">
        <div class="detail-placeholder">
            <span class="big-icon">🔍</span>
            <span>Click an item to view details</span>
        </div>
    </div>

</div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
let section = null;
let allItems = [];
let selectedId = null;
// Cache templates for collection cross-navigation
let templateCache = [];

// ── Helpers ──────────────────────────────────────────────────────────────────
function apiUrl() {
    return (document.getElementById('api-url').value || 'http://localhost:8000').replace(/\/$/, '');
}

function esc(str) {
    if (str == null) return '';
    return String(str)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function get(path) {
    const r = await fetch(apiUrl() + path);
    if (!r.ok) throw new Error(`HTTP ${r.status} — ${path}`);
    return r.json();
}

function itemId(item) {
    return item.character_id || item.template_id || item.stream_id
        || item.clip_id || item.location_id || item._col || '';
}

// ── Navigation ───────────────────────────────────────────────────────────────
function setNav(s) {
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    const btn = document.getElementById('nav-' + s);
    if (btn) btn.classList.add('active');
}

function setCount(s, n) {
    const el = document.getElementById('count-' + s);
    if (el) el.textContent = n != null ? n : '—';
}

// ── Section loading ──────────────────────────────────────────────────────────
async function loadSection(s) {
    section = s;
    selectedId = null;
    setNav(s);
    document.getElementById('search').value = '';
    document.getElementById('create-btn').style.display = s === 'locations' ? '' : 'none';
    showDetailPlaceholder();
    listLoading();

    try {
        allItems = await fetchSection(s);
        setCount(s, allItems.length);
        renderList(allItems);
    } catch(e) {
        listError(e.message);
    }
}

async function reload() { if (section) loadSection(section); }

async function fetchSection(s) {
    switch (s) {
        case 'characters':
            return get('/api/v1/characters?limit=500');
        case 'story-templates':
            const tpl = await get('/api/v1/story-templates?limit=500');
            templateCache = tpl;
            return tpl;
        case 'collections': {
            // Derive from story-templates
            const ts = templateCache.length ? templateCache
                     : await get('/api/v1/story-templates?limit=500');
            templateCache = ts;
            const map = {};
            for (const t of ts) {
                if (!map[t.collection]) map[t.collection] = [];
                map[t.collection].push(t);
            }
            const cols = Object.entries(map).map(([col, tpls]) => ({
                _col: col, templates: tpls
            }));
            setCount('collections', cols.length);
            return cols;
        }
        case 'streams':
            return get('/api/v1/streams');
        case 'clips':
            return get('/api/v1/clips?limit=500');
        case 'locations':
            return get('/api/v1/locations?limit=500');
        default:
            return [];
    }
}

// ── Filter ───────────────────────────────────────────────────────────────────
function applyFilter() {
    const q = document.getElementById('search').value.toLowerCase();
    const filtered = q
        ? allItems.filter(i => JSON.stringify(i).toLowerCase().includes(q))
        : allItems;
    renderList(filtered);
}

// ── List rendering ───────────────────────────────────────────────────────────
function listLoading() {
    document.getElementById('list-scroller').innerHTML =
        '<div class="spinner"></div>';
}

function listError(msg) {
    document.getElementById('list-scroller').innerHTML =
        `<div class="error-msg">⚠ ${esc(msg)}</div>`;
}

function renderList(items) {
    if (!items.length) {
        document.getElementById('list-scroller').innerHTML =
            '<div class="empty-state"><span class="empty-icon">📭</span><span>No items found</span></div>';
        return;
    }
    document.getElementById('list-scroller').innerHTML =
        items.map(item => cardHtml(item)).join('');
}

function cardHtml(item) {
    const id = itemId(item);
    const sel = id === selectedId ? ' selected' : '';
    return `<div class="card${sel}" data-id="${esc(id)}" onclick="selectItem('${esc(id)}')">`
         + cardBody(item)
         + '</div>';
}

function cardBody(item) {
    switch (section) {
        case 'characters':
            return `<div class="card-title">${esc(item.name)}</div>
                    <div class="card-id">${esc(item.character_id)}</div>
                    ${item.description ? `<div class="card-desc">${esc(item.description)}</div>` : ''}
                    <div class="card-tags">
                      ${item.video_search_tag ? `<span class="tag tag-cyan">${esc(item.video_search_tag)}</span>` : ''}
                      <span class="tag tag-purple">${item.voice_samples?.length ?? 0} voices</span>
                    </div>`;

        case 'story-templates':
            return `<div class="card-title">${esc(item.name)}</div>
                    <div class="card-id">${esc(item.template_id)}</div>
                    <div class="card-tags">
                      <span class="tag tag-orange">${esc(item.collection)}</span>
                      <span class="tag tag-green">${item.target_lines} lines</span>
                      ${(item.character_ids||[]).map(c=>`<span class="tag tag-cyan">${esc(c)}</span>`).join('')}
                    </div>`;

        case 'collections':
            return `<div class="card-title" style="font-family:'JetBrains Mono',monospace;font-size:0.85rem">${esc(item._col)}</div>
                    <div class="card-tags">
                      <span class="tag tag-purple">${item.templates.length} template${item.templates.length!==1?'s':''}</span>
                    </div>
                    <div class="card-tags">
                      ${item.templates.map(t=>`<span class="tag tag-cyan">${esc(t.name)}</span>`).join('')}
                    </div>`;

        case 'streams':
            return `<div class="card-title">${esc(item.name||item.stream_id)}</div>
                    <div class="card-id">${esc(item.stream_id)}</div>
                    <div class="card-tags">
                      <span class="tag ${item.is_active?'tag-green':'tag-orange'}">
                        ${item.is_active?'● active':'○ inactive'}
                      </span>
                    </div>
                    ${item.description ? `<div class="card-desc">${esc(item.description)}</div>` : ''}`;

        case 'clips':
            return `<div class="card-id" style="margin-bottom:0.25rem">${esc(item.clip_id)}</div>
                    <div class="card-desc">${esc(item.storage_path)}</div>
                    ${item.metadata?.duration ? `<div class="card-tags"><span class="tag tag-green">${item.metadata.duration.toFixed(1)}s</span></div>` : ''}`;

        case 'locations':
            return `<div class="card-title">${esc(item.name)}</div>
                    <div class="card-id">${esc(item.location_id)}</div>
                    <div class="card-tags">
                      <span class="tag tag-orange">${esc(item.story_template_id)}</span>
                    </div>
                    ${item.description ? `<div class="card-desc">${esc(item.description.slice(0,80))}${item.description.length>80?'…':''}</div>` : ''}`;

        default:
            return `<pre style="font-size:0.75rem;color:var(--text-secondary)">${esc(JSON.stringify(item,null,2))}</pre>`;
    }
}

// ── Detail ───────────────────────────────────────────────────────────────────
function showDetailPlaceholder() {
    document.getElementById('detail-panel').innerHTML =
        `<div class="detail-placeholder">
           <span class="big-icon">🔍</span>
           <span>Click an item to view details</span>
         </div>`;
}

async function selectItem(id) {
    selectedId = id;
    document.querySelectorAll('.card').forEach(c =>
        c.classList.toggle('selected', c.dataset.id === id)
    );
    document.getElementById('detail-panel').innerHTML =
        '<div class="spinner"></div>';

    try {
        const item = allItems.find(i => itemId(i) === id);
        if (!item) throw new Error('Item not found');

        // Fetch fresh detail where available
        let detail = item;
        if (section === 'characters')      detail = await get('/api/v1/characters/'      + encodeURIComponent(id));
        if (section === 'story-templates') detail = await get('/api/v1/story-templates/' + encodeURIComponent(id));
        if (section === 'streams')         detail = await get('/api/v1/streams/'         + encodeURIComponent(id));
        if (section === 'locations')       detail = await get('/api/v1/locations/'       + encodeURIComponent(id));

        document.getElementById('detail-panel').innerHTML = renderDetail(detail);
    } catch(e) {
        document.getElementById('detail-panel').innerHTML =
            `<div class="error-msg">⚠ ${esc(e.message)}</div>`;
    }
}

function renderDetail(item) {
    switch (section) {
        case 'characters':      return detailCharacter(item);
        case 'story-templates': return detailTemplate(item);
        case 'collections':     return detailCollection(item);
        case 'streams':         return detailStream(item);
        case 'clips':           return detailClip(item);
        case 'locations':       return detailLocation(item);
        default:
            return `<pre style="font-size:0.78rem;color:var(--text-secondary)">${esc(JSON.stringify(item,null,2))}</pre>`;
    }
}

// ── Character edits ───────────────────────────────────────────────────────────
async function saveCharacterFields(characterId) {
    const desc = document.getElementById('char-edit-desc');
    const tag  = document.getElementById('char-edit-tag');
    const btn  = document.getElementById('char-save-btn');
    const msg  = document.getElementById('char-save-msg');

    const fd = new FormData();
    fd.append('description', desc.value);
    fd.append('video_search_tag', tag.value);

    btn.disabled = true;
    msg.style.color = 'var(--text-secondary)';
    msg.textContent = 'Saving…';
    try {
        const r = await fetch(apiUrl() + '/api/v1/characters/' + encodeURIComponent(characterId), {
            method: 'PUT', body: fd
        });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        msg.style.color = 'var(--accent-green)';
        msg.textContent = '✓ Saved';
        // Refresh list in background to pick up changes
        allItems = await fetchSection('characters');
        setCount('characters', allItems.length);
        renderList(allItems);
    } catch(e) {
        msg.style.color = 'var(--accent-red)';
        msg.textContent = '⚠ ' + e.message;
    } finally {
        btn.disabled = false;
    }
}

async function addIdentityImages(characterId) {
    const input = document.getElementById('char-img-input');
    const btn   = document.getElementById('char-img-btn');
    const msg   = document.getElementById('char-img-msg');

    if (!input.files.length) {
        msg.style.color = 'var(--accent-orange)';
        msg.textContent = 'Select at least one image first.';
        return;
    }

    const fd = new FormData();
    for (const f of input.files) fd.append('identity_files', f);

    btn.disabled = true;
    msg.style.color = 'var(--text-secondary)';
    msg.textContent = 'Uploading…';
    try {
        const r = await fetch(
            apiUrl() + '/api/v1/characters/' + encodeURIComponent(characterId) + '/identity-images',
            { method: 'POST', body: fd }
        );
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const updated = await r.json();
        msg.style.color = 'var(--accent-green)';
        msg.textContent = `✓ ${updated.identity_images.length} image(s) total`;
        input.value = '';
        // Refresh detail to show new images
        document.getElementById('detail-panel').innerHTML = renderDetail(updated);
    } catch(e) {
        msg.style.color = 'var(--accent-red)';
        msg.textContent = '⚠ ' + e.message;
    } finally {
        btn.disabled = false;
    }
}

// ── Delete ────────────────────────────────────────────────────────────────────
async function deleteTemplate(templateId) {
    if (!confirm(`Delete story template "${templateId}"? This cannot be undone.`)) return;
    try {
        const r = await fetch(apiUrl() + '/api/v1/story-templates/' + encodeURIComponent(templateId), {
            method: 'DELETE'
        });
        if (!r.ok && r.status !== 204) throw new Error(`HTTP ${r.status}`);
        showDetailPlaceholder();
        await loadSection('story-templates');
    } catch(e) {
        document.getElementById('detail-panel').innerHTML +=
            `<div class="error-msg" style="margin-top:0.75rem">⚠ Delete failed: ${esc(e.message)}</div>`;
    }
}

async function deleteLocation(locationId) {
    if (!confirm(`Delete location "${locationId}"? This cannot be undone.`)) return;
    try {
        const r = await fetch(apiUrl() + '/api/v1/locations/' + encodeURIComponent(locationId), {
            method: 'DELETE'
        });
        if (!r.ok && r.status !== 204) throw new Error(`HTTP ${r.status}`);
        showDetailPlaceholder();
        await loadSection('locations');
    } catch(e) {
        document.getElementById('detail-panel').innerHTML +=
            `<div class="error-msg" style="margin-top:0.75rem">⚠ Delete failed: ${esc(e.message)}</div>`;
    }
}

// ── Create location ───────────────────────────────────────────────────────────
function showCreateLocationForm() {
    selectedId = null;
    document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));

    const templateOptions = templateCache.length
        ? `<select class="form-input" id="loc-new-template">
             <option value="">— select a template —</option>
             ${templateCache.map(t => `<option value="${esc(t.template_id)}">${esc(t.name)} (${esc(t.template_id)})</option>`).join('')}
           </select>`
        : `<input class="form-input" type="text" id="loc-new-template" placeholder="template-id">`;

    document.getElementById('detail-panel').innerHTML = `
    <div class="detail-header">
      <div class="detail-name">New Location</div>
    </div>
    <div class="detail-section">
      <div class="form-group">
        <label class="form-label">Name</label>
        <input class="form-input" type="text" id="loc-new-name" placeholder="e.g. Medieval Castle">
        <div style="font-size:0.72rem;color:var(--text-secondary);margin-top:0.25rem">ID will be derived automatically (lowercase, spaces → hyphens)</div>
      </div>
      <div class="form-group">
        <label class="form-label">Story Template</label>
        ${templateOptions}
      </div>
      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea class="form-textarea" id="loc-new-desc" rows="6" placeholder="Diffusion-model prompt for this location…"></textarea>
      </div>
      <button class="btn-primary" id="loc-create-btn" onclick="createLocation()">+ Create location</button>
      <div id="loc-create-msg" style="font-size:0.78rem;margin-top:0.5rem"></div>
    </div>`;
}

async function createLocation() {
    const name     = document.getElementById('loc-new-name').value.trim();
    const template = document.getElementById('loc-new-template').value.trim();
    const desc     = document.getElementById('loc-new-desc').value.trim();
    const btn      = document.getElementById('loc-create-btn');
    const msg      = document.getElementById('loc-create-msg');

    if (!name || !template || !desc) {
        msg.style.color = 'var(--accent-orange)';
        msg.textContent = 'All fields are required.';
        return;
    }

    const fd = new FormData();
    fd.append('name', name);
    fd.append('description', desc);
    fd.append('story_template_id', template);

    btn.disabled = true;
    msg.style.color = 'var(--text-secondary)';
    msg.textContent = 'Creating…';
    try {
        const r = await fetch(apiUrl() + '/api/v1/locations', { method: 'POST', body: fd });
        if (!r.ok) {
            const err = await r.json().catch(() => ({}));
            throw new Error(err.detail || `HTTP ${r.status}`);
        }
        const loc = await r.json();
        msg.style.color = 'var(--accent-green)';
        msg.textContent = `✓ Created: ${loc.location_id}`;
        allItems = await fetchSection('locations');
        setCount('locations', allItems.length);
        renderList(allItems);
        selectItem(loc.location_id);
    } catch(e) {
        msg.style.color = 'var(--accent-red)';
        msg.textContent = '⚠ ' + e.message;
        btn.disabled = false;
    }
}

// ── Cross-navigation ─────────────────────────────────────────────────────────
async function jumpToTemplate(templateId) {
    await loadSection('story-templates');
    selectItem(templateId);
}

// ── Bootstrap ────────────────────────────────────────────────────────────────
loadSection('characters');
</script>
