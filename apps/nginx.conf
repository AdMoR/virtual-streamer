server {
    listen 80;

    # Serve static HTML files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Proxy Virtual Streamer API requests
    location /api/ {
        proxy_pass http://virtual_streamer_api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_connect_timeout 60;
        proxy_send_timeout 60;
        proxy_read_timeout 60;
    }

    # Proxy MinIO requests - preserves presigned URL signatures
    location /minio/ {
        # Remove /minio prefix and proxy to MinIO
        rewrite ^/minio/(.*) /$1 break;
        
        proxy_pass http://minio:9000;
        
        # IMPORTANT: Set Host header to match what was used for signing
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Required for streaming video
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Increase timeouts for large video files
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }
}
