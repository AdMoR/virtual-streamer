version: '3'
services:
  tts:
    build:
      context: .
      dockerfile: docker/docker_fr_tts/Dockerfile
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - 8001:8001
    networks:
      - tts
  virtual_streamer:
    build:
      context: .
      dockerfile: docker/docker_worker/Dockerfile
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - tts
      - rabbitmq
    devices:
      - /dev/nvidia0:/dev/nvidia0
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - RMQ_HOST=rabbitmq
      - TTS_HOST=tts
      - OUT_VIDEO_FOLDER=/src/generations
      - S3_BUCKET_URL=virtual-streamer-output
      - AWS_SHARED_CREDENTIALS_FILE=/root/.aws/credentials
      - AWS_CONFIG_FILE=/root/.aws/config
    networks:
      - tts
      - rabbit
    volumes:
      - $HOME/.aws/credentials:/root/.aws/credentials
      - $HOME/.aws/config:/root/.aws/config
      - generations:/src/generations
      - prompts:/src/prompts
    env_file:
      - .env
    restart: always
  rabbitmq:
    image: rabbitmq:latest
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - ~/.docker-conf/rabbitmq/data/:/var/lib/rabbitmq/
      - ~/.docker-conf/rabbitmq/log/:/var/log/rabbitmq
    networks:
      - rabbit
  entity-api:
    build:
      context: .
      dockerfile: docker/docker_entity_api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Pass environment variables from your host or a .env file
      - AWS_REGION_NAME=${AWS_REGION_NAME}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      # Credentials should ideally be handled via mounted ~/.aws or IAM roles
      # Or uncomment these if using explicit keys from .env
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      # Optional: For local S3 like MinIO
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
    networks:
      - video_net


volumes:
  generations:
    driver: local # Define the driver and options under the volume name
    driver_opts:
      type: none
      device: /media/amor/data/videos
      o: bind
  prompts:
    driver: local # Define the driver and options under the volume name
    driver_opts:
      type: none
      device: /media/amor/data/prompts
      o: bind


networks:
  tts:
  rabbit:
