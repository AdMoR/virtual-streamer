version: '3'
services:
  tts:
    build:
      context: .
      dockerfile: docker/docker_tts/Dockerfile
    runtime: nvidia
    devices:
      - /dev/nvidia0:/dev/nvidia0
    ports:
      - 8001:8001
    networks:
      - tts
  virtual_streamer:
    build:
      context: .
      dockerfile: docker/docker_worker/Dockerfile
    runtime: nvidia
    depends_on:
      - tts
      - rabbitmq
    devices:
      - /dev/nvidia0:/dev/nvidia0
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - RMQ_HOST=rabbitmq
      - TTS_HOST=tts
    networks:
      - tts
      - rabbit
    volumes:
      - generations:/src/generations
      - prompts:/src/prompts
    env_file:
      - .env
  rabbitmq:
    image: rabbitmq:latest
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - ~/.docker-conf/rabbitmq/data/:/var/lib/rabbitmq/
      - ~/.docker-conf/rabbitmq/log/:/var/log/rabbitmq
    networks:
      - rabbit


volumes:
  model_cache_2:
  generations:
  prompts:


networks:
  tts:
  rabbit:
    driver: overlay
