services:
  # Unified Virtual Streamer API
  # Now using UV for fast dependency management
  virtual_streamer_api:
    ports:
      - "8000:8000"
    build:
      context: .
      dockerfile: docker/docker_worker/Dockerfile
      args:
        PYTHON_VERSION: "3.9"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    devices:
      - /dev/nvidia0:/dev/nvidia0
    depends_on:
      - minio
      - mysql
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      # TTS Service
      - FISH_TTS_HOST=tts
      - FISH_TTS_PORT=8003
      - OPENAI_API_KEY= # we call a local server
      # Directories
      - DATA_DIR=/data
      - TEMP_DIR=/tmp/virtual_streamer
      - OUT_VIDEO_FOLDER=/src/generations
      # MinIO Storage Configuration
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=virtual-streamer
      # MySQL Configuration
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=virtual_streamer
      - MYSQL_PASSWORD=streamerpass
      - MYSQL_DATABASE=virtual_streamer
      # video embedding search
      - VIDEO_SEARCH_SERVER_URL=http://video-embedding-server:8004
      # API configuration
      - API_HOST=0.0.0.0
      - API_PORT=8000
    networks:
      - tts
    volumes:
      - videos:/src/generations
      - traces:/src/prompts
    env_file:
      - .env
    restart: always
    # Command is now in Dockerfile (no override needed)

  video-embedding-server:
    build:
      context: /home/amor/Documents/code_dw/video_embedding_server
      dockerfile: /home/amor/Documents/code_dw/video_embedding_server/Dockerfile
    image: video-embedding-server:latest
    container_name: video-embedding-server
    depends_on:
      - qdrant

    # NO GPU sections - removed deploy.resources and devices

    environment:
      # Force CPU-only execution
      - JAX_PLATFORM_NAME=cpu
      - CUDA_VISIBLE_DEVICES=
      # Qdrant connection
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333

    volumes:
      - /media/amor/data1/Downloads/CPS/fred_voice_clips_embeddings/:/app/data/embeddings
      - huggingface-cache:/root/.cache/huggingface
    networks:
      - tts
    stdin_open: true
    tty: true
    ports:
      - "8004:8004"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - tts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: virtual_streamer
      MYSQL_USER: virtual_streamer
      MYSQL_PASSWORD: streamerpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - tts
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    networks:
      - tts
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  video_server:
    build:
      context: .
      dockerfile: docker/streaming/video_server/Dockerfile
    container_name: streaming_video_server
    ports:
      - "5000:5000"
    environment:
      # Main API URL (must be reachable from this container)
      - API_URL=http://virtual_streamer_api:8000
      # Stream ID to play from
      - STREAM_ID=${STREAM_ID:-default}
      - OPENAI_API_KEY=""
    networks:
      - tts
    volumes:
      - atari_roms:/root/.ale
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  # Static file server + MinIO proxy for HTML apps
  html_apps:
    image: nginx:alpine
    container_name: html_apps
    ports:
      - "8080:80"
    volumes:
      - ./apps:/usr/share/nginx/html:ro
      - ./apps/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - tts
    depends_on:
      - minio
    restart: unless-stopped

  obs:
    build:
      context: .
      dockerfile: docker/streaming/obs/Dockerfile
    container_name: streaming_obs
    networks:
      - tts
    # Enable NVIDIA GPUs via Compose device_requests
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    shm_size: 512m
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x obs >/dev/null && curl -fsS http://localhost:6081/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - VIDEO_SERVER_URL=http://video_server:5000
      - VNC_PASSWD=headless
    ports:
      # VNC access
      - "5901:5901"
      - "6081:6081"
      # noVNC web access
      - "6901:6901"
      # OBS WebSocket
      - "4455:4455"
    devices:
      - /dev/nvidia0:/dev/nvidia0
    volumes:
      # Optional: Mount custom OBS scenes
      # - ./configs/streaming/obs_scenes:/config/obs-studio/basic/scenes
      # Shared video folder (if needed for local playback)
      - videos:/videos
    depends_on:
      video_server:
        condition: service_healthy
    restart: always

volumes:
  atari_roms:
    driver: local
    driver_opts:
      type: none
      device: /media/amor/data/virtual_streamer_folder/ATARI
      o: bind
  videos:
    driver: local # Define the driver and options under the volume name
    driver_opts:
      type: none
      device: /media/amor/data/virtual_streamer_folder/videos
      o: bind
  traces:
    driver: local # Define the driver and options under the volume name
    driver_opts:
      type: none
      device: /media/amor/data/virtual_streamer_folder/prompts
      o: bind
  minio_data:
    driver: local # Define the driver and options under the volume name
    driver_opts:
      type: none
      device: /media/amor/data/virtual_streamer_folder/storage
      o: bind
  mysql_data:
  qdrant_data:
  huggingface-cache:
  tts_references:
    driver: local # Define the driver and options under the volume name
    driver_opts:
      type: none
      device: /media/amor/data/virtual_streamer_folder/tts_references
      o: bind
  tts_checkpoints:
    driver: local # Define the driver and options under the volume name
    driver_opts:
      type: none
      device: /media/amor/data/virtual_streamer_folder/tts_checkpoints
      o: bind



networks:
  tts:
