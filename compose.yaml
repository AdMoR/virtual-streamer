version: '3'
services:
  virtual_streamer:
    ports:
      - 8000:8000
    build:
      context: .
      dockerfile: docker/docker_worker/Dockerfile
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    devices:
      - /dev/nvidia0:/dev/nvidia0
    depends_on:
      - tts
      - entity_api
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - TTS_HOST=tts
      - OUT_VIDEO_FOLDER=/src/generations
      - S3_BUCKET_URL=virtual-streamer-output
      - AWS_SHARED_CREDENTIALS_FILE=/root/.aws/credentials
      - AWS_CONFIG_FILE=/root/.aws/config
      - ENTITY_SERVICE_HOST=entity_api
    networks:
      - tts
      - entity_api
    volumes:
      - $HOME/.aws/credentials:/root/.aws/credentials
      - $HOME/.aws/config:/root/.aws/config
      - videos:/src/generations
      - traces:/src/prompts
    env_file:
      - .env
    restart: always

  tts:
    build:
      dockerfile: docker/docker_fr_tts/Dockerfile
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - 8001:8001
    networks:
      - tts

  entity_api:
    build:
      context: .
      dockerfile: docker/docker_entity_api/Dockerfile
    ports:
      - "8002:8002"
    environment:
      # Pass environment variables from your host or a .env file
      - AWS_REGION_NAME=${AWS_REGION_NAME}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      # Credentials should ideally be handled via mounted ~/.aws or IAM roles
      # Or uncomment these if using explicit keys from .env
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      # Optional: For local S3 like MinIO
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
    volumes:
      - entities:/data
    networks:
      - entity_api


volumes:
  videos:
    driver: local # Define the driver and options under the volume name
    driver_opts:
      type: none
      device: /media/amor/data1/virtual_streamer_folder/videos
      o: bind
  traces:
    driver: local # Define the driver and options under the volume name
    driver_opts:
      type: none
      device: /media/amor/data1/virtual_streamer_folder/prompts
      o: bind
  entities:
    driver: local # Define the driver and options under the volume name
    driver_opts:
      type: none
      device: /media/amor/data1/virtual_streamer_folder/entities
      o: bind


networks:
  tts:
  entity_api:
