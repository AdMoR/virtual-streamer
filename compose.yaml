version: '3'
services:
  # Unified Virtual Streamer API (combines all services including Wav2Lip)
  # Now using UV for fast dependency management
  virtual_streamer_api:
    ports:
      - "8000:8000"
    build:
      context: .
      dockerfile: docker/docker_worker/Dockerfile
      args:
        PYTHON_VERSION: "3.9"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    devices:
      - /dev/nvidia0:/dev/nvidia0
    depends_on:
      - tts
      - minio
      - mysql
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      # TTS Service
      - FISH_TTS_HOST=tts
      - FISH_TTS_PORT=8003
      # Directories
      - DATA_DIR=/data
      - TEMP_DIR=/tmp/virtual_streamer
      - OUT_VIDEO_FOLDER=/src/generations
      # MinIO Storage Configuration
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=virtual-streamer
      # MySQL Configuration
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=virtual_streamer
      - MYSQL_PASSWORD=streamerpass
      - MYSQL_DATABASE=virtual_streamer
      # Model checkpoint
      - CHECKPOINT_PATH=/app/checkpoints/Wav2Lip.pth
      # API configuration
      - API_HOST=0.0.0.0
      - API_PORT=8000
    networks:
      - tts
    volumes:
      - videos:/src/generations
      - traces:/src/prompts
    env_file:
      - .env
    restart: always
    # Command is now in Dockerfile (no override needed)

  tts:
    #build:
    #  dockerfile: docker/docker_fr_tts/Dockerfile
    image: fishaudio/fish-speech:server-cuda
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./references:/app/references
    environment:
      - COMPILE=1
      - API_SERVER_PORT=8003
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8003:8003"
    networks:
      - tts

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - tts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: virtual_streamer
      MYSQL_USER: virtual_streamer
      MYSQL_PASSWORD: streamerpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - tts
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  videos:
    driver: local # Define the driver and options under the volume name
    driver_opts:
      type: none
      device: /media/amor/data1/virtual_streamer_folder/videos
      o: bind
  traces:
    driver: local # Define the driver and options under the volume name
    driver_opts:
      type: none
      device: /media/amor/data1/virtual_streamer_folder/prompts
      o: bind
  minio_data:
    driver: local # Define the driver and options under the volume name
    driver_opts:
      type: none
      device: /media/amor/data1/virtual_streamer_folder/storage
      o: bind
  mysql_data:



networks:
  tts:
