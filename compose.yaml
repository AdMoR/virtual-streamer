version: '3'
services:
  tts:
    image: ghcr.io/coqui-ai/tts
    runtime: nvidia
    devices:
      - /dev/nvidia0:/dev/nvidia0
    ports:
      - 5002:5002
    volumes:
       - model_cache_2:/root/.local/share
    networks:
      - tts
    entrypoint: ["python3", "TTS/server/server.py", "--model_name", "tts_models/multilingual/multi-dataset/your_tts", "--use_cuda", "true"]
  virtual_streamer:
    build:
      context: .
      dockerfile: docker_worker/Dockerfile
    runtime: nvidia
    devices:
      - /dev/nvidia0:/dev/nvidia0
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    networks:
      - tts
      - rabbit
    volumes:
      - generations:/src/generations
      - prompts:/src/prompts
    env_file:
      - .env
  rabbitmq:
    image: rabbitmq:latest
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - ~/.docker-conf/rabbitmq/data/:/var/lib/rabbitmq/
      - ~/.docker-conf/rabbitmq/log/:/var/log/rabbitmq
    networks:
      - rabbit


volumes:
  model_cache_2:
  generations:
  prompts:


networks:
  tts:
  rabbit:
    driver: bridge
