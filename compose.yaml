version: '3'
services:
  # Unified Virtual Streamer API (combines all services including Wav2Lip)
  virtual_streamer_api:
    ports:
      - "8000:8000"
    build:
      context: .
      dockerfile: docker/docker_worker/Dockerfile
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    devices:
      - /dev/nvidia0:/dev/nvidia0
    depends_on:
      - tts
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      # TTS Service
      - FISH_TTS_HOST=tts
      - FISH_TTS_PORT=8003
      # Directories
      - DATA_DIR=/data
      - TEMP_DIR=/tmp/virtual_streamer
      - OUT_VIDEO_FOLDER=/src/generations
      # AWS S3 for video storage
      - S3_BUCKET_URL=virtual-streamer-output
      - AWS_SHARED_CREDENTIALS_FILE=/root/.aws/credentials
      - AWS_CONFIG_FILE=/root/.aws/config
      # Model checkpoint
      - CHECKPOINT_PATH=/app/checkpoints/Wav2Lip.pth
      # API configuration
      - API_HOST=0.0.0.0
      - API_PORT=8000
    networks:
      - tts
    volumes:
      - $HOME/.aws/credentials:/root/.aws/credentials
      - $HOME/.aws/config:/root/.aws/config
      - videos:/src/generations
      - traces:/src/prompts
      - entities:/data
    env_file:
      - .env
    restart: always
    command: >
      sh -c "python -m uvicorn virtual_streamer.api.main:app 
      --host 0.0.0.0 
      --port 8000 
      --workers 1"

  tts:
    #build:
    #  dockerfile: docker/docker_fr_tts/Dockerfile
    image: fishaudio/fish-speech:server-cuda
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./references:/app/references
    environment:
      - COMPILE=1
      - API_SERVER_PORT=8003
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8003:8003"
    networks:
      - tts

volumes:
  videos:
    driver: local # Define the driver and options under the volume name
    driver_opts:
      type: none
      device: /media/amor/data1/virtual_streamer_folder/videos
      o: bind
  traces:
    driver: local # Define the driver and options under the volume name
    driver_opts:
      type: none
      device: /media/amor/data1/virtual_streamer_folder/prompts
      o: bind
  entities:
    driver: local # Define the driver and options under the volume name
    driver_opts:
      type: none
      device: /media/amor/data1/virtual_streamer_folder/entities
      o: bind


networks:
  tts:
