[project]
name = "virtual-streamer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic>=0.72.0",
    "batch-face>=1.5.2",
    "boto3>=1.40.6",
    "botocore>=1.40.6",
    "fastapi[standard]>=0.116.1",
    "faster-whisper>=1.2.1",
    "g2p-en>=2.1.0",
    "google-adk[eval]>=1.14.1",
    "gradio-client>=1.3.0",
    "httpx>=0.28.1",
    "imageio>=2.37.0",
    "langchain-community>=0.3.27",
    "langchain-core>=0.3.74",
    "librosa==0.9.1",
    "litellm>=1.0.0",
    "llama-index>=0.8.62",
    "llama-index-embeddings-huggingface>=0.6.1",
    "llama-index-retrievers-bm25>=0.6.5",
    "mediapipe>=0.10.14",
    "mlflow>=3.1.4",
    "num2words>=0.5.14",
    "numba>=0.60.0",
    "numpy<2",
    "obsws-python>=1.8.0",
    "openai==1.99.9",
    "opencv-python==4.6.0.66",
    "ormsgpack>=1.11.0",
    "pika>=1.3.2",
    "pyserde>=0.23.0",
    "python-multipart>=0.0.20",
    "requests>=2.32.4",
    "soxr>=1.0.0",
    "stable-ts>=2.19.1",
    "streamlit>=1.48.0",
    "syllable>=0.1.0",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "tqdm>=4.67.1",
    "transformers>=4.57.1",
    "twitch-python>=0.0.20",
    "uvicorn[standard]>=0.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["virtual_streamer"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
