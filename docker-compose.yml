version: '3'

services:
  webservice:
    build:
      context: .
      dockerfile: docker/docker_worker/Dockerfile
    restart: unless-stopped
    environment:
      - PORT=5000
      - WEBSERVICE_URL=http://webservice:5000
      - OUT_VIDEO_FOLDER=/data/out_video_folder
      - S3_BUCKET_URL=${S3_BUCKET_URL:-default-bucket}
      - CHECKPOINT_PATH=/src/checkpoints/Wav2Lip.pth
    volumes:
      - ./data:/data
    ports:
      - "5000:5000"
    command: python3 webservice.py
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  rmq_consumer:
    build:
      context: .
      dockerfile: docker/docker_worker/Dockerfile
    restart: unless-stopped
    depends_on:
      - webservice
    environment:
      - WEBSERVICE_URL=http://webservice:5000
      - OUT_VIDEO_FOLDER=/data/out_video_folder
      - S3_BUCKET_URL=${S3_BUCKET_URL:-default-bucket}
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
    volumes:
      - ./data:/data
    command: python3 inference.py
