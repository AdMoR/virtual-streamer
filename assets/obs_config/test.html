<!DOCTYPE html>
<html>

<body>
  <div>
    <video id="videoPlayer" width = "1920"
    height = "1080"
    autoplay>
    </video>
  </div>
  
  <script type='text/javascript'>


document.addEventListener("DOMContentLoaded", function() {
    const videoPlayer = document.getElementById('videoPlayer');
    let videoList = [];
    let currentIndex = -1;

    async function fetchVideoFiles() {
        const response = await fetch('http://video_server:5000/videos');
        if (response.ok) {
            videoList = await response.json();
            currentIndex = 0;
            console.log(videoList)
            return videoList;
        } else {
            console.error('Failed to fetch video files');
            return videoList;
        }
    }

    async function playNextVideo() {
        let hasNewVideo = await fetch('http://video_server:5000/hasNewVideo', {
          mode: 'no-cors',
        }).then(function(response) {
            return parseInt(response.status, 10)
        });
        if (hasNewVideo == 200) {
            videoList = await fetchVideoFiles()
            currentIndex = 0; // Reset to the first video
            console.log("New video play next")
            videoPlayer.src = videoList[0];
        }
        else{
            console.log("Nothing new, play next")
            videoPlayer.src = videoList[currentIndex];
        }
                console.log("coucou", currentIndex)
        videoPlayer.play();
        currentIndex = (currentIndex + 1) % videoList.length;
    }

    videoPlayer.addEventListener('ended', playNextVideo);

    async function initializePlayer() {
        await fetchVideoFiles();
        playNextVideo();
    }

    initializePlayer();
});


</script>
</body>

</html>
