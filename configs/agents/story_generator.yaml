# Story Generator Agent Configuration
# Generates structured story from title using LLM

name: story_generator

model:
  # Use Claude Sonnet for high-quality creative writing
  provider: anthropic
  model: claude-sonnet-4-5-20250929 # claude-opus-4-5-20251101 # claude-sonnet-4-5-20250929
  parameters:
    temperature: 0.3  # Higher temperature for creativity
    #host: http://100.114.182.89:808
    max_tokens: 4096

metadata:
  version: "1.0.0"
  description: "Generates C'est pas Sorcier parody stories from titles"
  owners:
    - virtual-streamer-team
  tags:
    - story-generation
    - creative-writing
    - french

transfer_policy:
  allow_transfer: false
  allowed_targets: []

include_contents: true

