# Location Writer Agent Configuration
# First step of the location builder pipeline:
# generates a detailed free-text diffusion description for a location

name: location_writer

model:
  provider: openai
  model: Qwen3-VL-8B-Instruct-GGUF:UD-Q4_K_XL
  parameters:
    temperature: 0.3
    max_output_tokens: 4096
    api_base: http://100.114.182.89:8081
metadata:
  version: "1.0.0"
  description: "Generates a detailed diffusion-model description for a scene location"
  owners:
    - virtual-streamer-team
  tags:
    - location-building
    - image-generation

transfer_policy:
  allow_transfer: false
  allowed_targets: []

include_contents: true